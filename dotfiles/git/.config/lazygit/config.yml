---
gui:
  theme:
    # The terminal's ANSI blue is ayu's light blue (#73B8FF), so lazygit's
    # default blue selection background leaves the light default foreground
    # unreadable. Use the theme's dark "active" colour instead.
    selectedLineBgColor:
      - '#1f3350'
    # Don't bold the selected row: the Regolith look paints bold default text
    # blue, which weakens the contrast with the selection background.
    selectedLineFgColor:
      - default

git:
  pagers:
    # Multiple pagers are supported; cycle through them with the | key.

    # --line-numbers renders file hyperlinks in the diff to jump to that
    # location in the code.
    - pager: |
        delta --dark --paging=never --line-numbers --hyperlinks \
          --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

    # Some diff tools can't work as a simple pager like the ones above do,
    # because they need access to the entire diff, so just post-processing
    # git's diff is not enough for them.
    - externalDiffCommand: difft --color=always

    # Show changes in a single column - helpful in narrower windows
    - externalDiffCommand: difft --color=always --display=inline

    # Git default pager
    - {}


customCommands:
  # 'gl' commands live behind a single menu key: only <c-g> must be unique in
  # lazygit's keymap, the entries' keys are scoped to the menu.
  - key: '<c-g>'
    description: 'GitLab'
    commandMenu:
      - key: 'm'
        description: 'Open merge request for current branch'
        command: 'gl open mr'
        context: 'global'
        # gl may prompt (to create the MR if none exists), so it needs a TTY.
        output: 'terminal'

      - key: 'o'
        description: 'Open repository in GitLab'
        command: 'gl open forge'
        context: 'global'
        # Show the 'Opening ...' message, and any error (e.g. VPN off).
        # Use 'none' for silent execution.
        output: 'popup'
